[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robust-walker-di"
version = "0.1.0"
description = "Distributed sensory communication and failure recovery experiments for a quadruped-like embodied controller."
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "matplotlib",
  "pillow",
]

[tool.setuptools]
packages = ["robust_walker"]
